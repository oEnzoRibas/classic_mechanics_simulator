<div
    id="solution-modal-overlay"
    style="
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(0, 0, 0, 0.60);

        z-index: 99998;
    "
>

    <div
        style="
            width: min(950px, 88vw);
            height: min(800px, 85vh);

            display: flex;
            flex-direction: column;

            background: #111827;
            color: #e5e7eb;

            border: 1px solid #374151;
            border-radius: 16px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.75);

            overflow: hidden;

            font-family: Arial, sans-serif;
        "
    >

        <!-- HEADER EM UMA SÓ LINHA -->
        <div
            style="
                flex: 0 0 auto;

                display: flex;
                align-items: center;
                justify-content: space-between;

                padding: 12px 24px;

                background: #111827;

                border-bottom: 1px solid #374151;
            "
        >

            <div
                style="
                    display: flex;
                    align-items: baseline;
                    gap: 12px;
                    overflow: hidden;
                "
            >
                <h2
                    style="
                        margin: 0;
                        color: #f9fafb;
                        font-size: 18px;
                        white-space: nowrap;
                    "
                >
                    📐 $TITLE
                </h2>

                <div
                    style="
                        color: #9ca3af;
                        font-size: 13px;
                        white-space: nowrap;
                        overflow: hidden;
                        text-overflow: ellipsis;
                    "
                >
                    $SUBTITLE
                </div>
            </div>

            <button
                type="button"
                title="Fechar"
                onclick="
                    document
                        .getElementById('solution-modal-overlay')
                        .style.display = 'none';
                "
                style="
                    display: flex;
                    align-items: center;
                    justify-content: center;

                    width: 32px;
                    height: 32px;

                    margin-left: 16px;
                    flex-shrink: 0;

                    padding: 0;

                    border: none;
                    border-radius: 8px;

                    background: #1f2937;
                    color: #d1d5db;

                    font-size: 22px;
                    line-height: 1;

                    cursor: pointer;
                "
            >
                &times;
            </button>

        </div>

        <!-- CONTEÚDO ROLÁVEL -->
        <div
            style="
                flex: 1 1 auto;

                min-height: 0;

                overflow-y: auto;
                overflow-x: hidden;

                padding: 28px 36px 40px 36px;

                font-size: 16px;
                line-height: 1.7;
            "
        >

            $CONTENT

        </div>

    </div>

</div>
