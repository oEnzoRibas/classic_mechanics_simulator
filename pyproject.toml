[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"


[project]
name = "classical-mechanics-simulator"
version = "0.0.1"
description = "Educational mechanics simulator"
requires-python = ">=3.12,<3.13"

dependencies = [
    "vpython==7.6.5",
    "numpy>=2.3.0",
    "latex2mathml>=3.81.1",
    "matplotlib>=3.11.2",
]


[dependency-groups]
dev = [
    "watchdog>=6.0.0",
]


[tool.uv]
package = true


[tool.setuptools.packages.find]
where = ["src"]
include = [
    "relative_movement*",
    "common*",
]


[tool.setuptools.package-data]
"relative_movement.balloon.apps.vpython" = [
    "solutions/*.tex",
]